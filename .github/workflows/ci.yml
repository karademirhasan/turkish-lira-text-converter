name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Type-check package declarations
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build CommonJS entry
        run: npm run build:cjs
      - name: Test browser-targeted entry
        run: npm run test:browser
      - name: Verify packed consumers
        run: npm run verify:package

  typecheck:
    name: TypeScript ${{ matrix.typescript-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript-version: [5.8.2, 5.9.3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install package dependencies
        run: npm ci --ignore-scripts
      - name: Install TypeScript version
        run: npm install --no-save --no-package-lock --ignore-scripts "typescript@${{ matrix.typescript-version }}"
      - name: Type-check declarations
        run: npm run typecheck
